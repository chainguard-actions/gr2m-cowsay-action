name: Test cowsay with special characters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: cowsay
        uses: .
        with:
          text: "Moo! I love GitHub Actions :)"
      - name: Assert action succeeded with special characters
        env:
          OUTCOME: ${{ steps.cowsay.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with special characters, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: cowsay action handled special characters successfully"
